# Smoke test: same pipeline, tiny sizes. Results are NOT for interpretation.
experiment_id: H1-001-smoke
environment_config: configs/environments/gripper_lift.yaml
predictor_config: configs/predictors/default.yaml
T: 60
K: 4
H: 10
predictor_seeds: [0, 1]
n_train_episodes: 150
n_val_episodes: 30
n_pred_test_episodes: 30
corrections_in_training: true
predictor:
  mlp:
    epochs: 5
h1a:
  n_trials: 140
  magnitudes: [0.0, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]
  strata: [near_onset, uniform]
h1b:
  n_trials_per_magnitude: 6
  magnitudes: [0.0, 0.1, 0.3]
  correction_times: [10, 20, 30]
  N_min: 1.7
  kappa: 7.5
  fixed_rate_period: 5
  min_lift: 0.05
