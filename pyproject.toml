[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-learning"
version = "0.1.0"
description = "Contact-aware robot learning: when should a robot retain, revise, or disregard its predicted contact?"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "torch>=2.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
